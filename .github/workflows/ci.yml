name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Core service tests assert transactional behaviour (a registry entry and a module
    # row commit or roll back together), which only a real database can prove.
    services:
      postgres:
        # pgvector, not plain postgres: migration 0005 does CREATE EXTENSION vector,
        # and it is the image both compose files already run.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://platform:platform@localhost:5432/platform
      # The suite truncates between cases, so it gets its own database. `pnpm test`
      # creates and migrates it; the guard in src/test/db.ts refuses anything not
      # ending in _test.
      TEST_DATABASE_URL: postgres://platform:platform@localhost:5432/platform_test
      ZITADEL_ISSUER: https://finsera-dashboard-nsncri.eu1.zitadel.cloud
      ZITADEL_CLIENT_ID: "383629804357893947"

    steps:
      - uses: actions/checkout@v4

      # No `version` here on purpose: packageManager in package.json pins the exact
      # pnpm, and the action refuses to run when both name one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate database
        run: pnpm --filter @platform/api db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Architectural boundaries
        run: pnpm boundaries
