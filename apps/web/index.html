<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the bottom tab bar can sit on the home indicator and pad itself
         with env(safe-area-inset-bottom), rather than float above a strip of dead page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The browser chrome takes the canvas colour, so on a phone the status bar and the page
         read as one surface. Values match --bg in styles.css. -->
    <meta name="theme-color" content="#eae5de" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0b0c" media="(prefers-color-scheme: dark)" />
    <!-- Installable: on an iPhone, push only reaches a web app added to the Home Screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Finsera" />
    <title>Finsera Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
