# Production stack (spec §9). Identical locally and on Hetzner — only deploy/.env differs.
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# A modular monolith deploys as one app, so this stays deliberately small: one reverse
# proxy, one API, one database, one backup job.
name: finsera-platform

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_ZITADEL_ISSUER: ${ZITADEL_ISSUER}
        VITE_ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID}
    environment:
      # Blank locally → Caddy listens on :80 inside the container; a domain in
      # production → Caddy provisions TLS for it.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # The client portals' hostnames (Phase 8): "*.finsera.nl, portal.finsera.nl" in
      # production. Everything on them is proxied to the API, which serves the portal
      # bundle itself and decides what each path is. The default is a port nothing
      # publishes, so the block is inert until this is set.
      PORTAL_ADDRESSES: ${PORTAL_ADDRESSES:-localhost:9443}
      # What Caddy asks before getting a certificate for a hostname it has not seen.
      PORTAL_ASK_URL: ${PORTAL_ASK_URL:-http://api:3001/api/portal-host/check}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID}
      # The rest of the auth configuration, which used to stop at the two above — so a
      # deployed instance could not name its project, could not rename either role, and
      # ran a portal that refused every request for want of its own client id.
      ZITADEL_PORTAL_CLIENT_ID: ${ZITADEL_PORTAL_CLIENT_ID:-}
      ZITADEL_INTERNAL_ROLE: ${ZITADEL_INTERNAL_ROLE:-internal}
      ZITADEL_PORTAL_ROLE: ${ZITADEL_PORTAL_ROLE:-portal_client}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:-}
      # No default: unset leaves the gate enforced, which is the point of it (G6).
      PORTAL_ROLE_CHECK: ${PORTAL_ROLE_CHECK:-}
      # ── client portal on its own hosts (Phase 8) ──
      # The login is done server-side now: the portal application's secret (blank keeps
      # it a public PKCE application), the domain client portals hang off, the host the
      # login callback lives on, and the key that signs the in-flight login state. The
      # last one has no default and the API refuses to boot in production without it.
      ZITADEL_PORTAL_CLIENT_SECRET: ${ZITADEL_PORTAL_CLIENT_SECRET:-}
      PORTAL_BASE_DOMAIN: ${PORTAL_BASE_DOMAIN:-}
      PORTAL_AUTH_HOST: ${PORTAL_AUTH_HOST:-}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-}
      # Encrypts the per-page bypass secrets. Absent here and the admin form permanently
      # says it cannot store one — and the workaround somebody reaches for is turning
      # Vercel's deployment protection off, which is the whole problem P3 exists to end.
      PORTAL_PAGE_KEY: ${PORTAL_PAGE_KEY:-}
      # Shared with Caddy's on-demand-TLS `ask` URL, so that endpoint answers the reverse
      # proxy and not anyone who can reach /api. Unset leaves it open.
      PORTAL_ASK_TOKEN: ${PORTAL_ASK_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      # The gateway, which was missing here — so a key set in deploy/.env reached the host
      # and stopped. There is no `env_file` on this service: only what is named in this
      # block enters the container, which makes an omission look exactly like an unset
      # value. Every OpenRouter model was absent from the picker in production while
      # working locally, because `choices()` returns nothing at all without the key.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # OpenRouter's attribution headers. Optional, and the one place a runaway spend is
      # visible before the invoice — anonymous traffic cannot be attributed to this app.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # What the gateway's dollar prices are converted at, for the cost figures.
      RATE_USD_PER_EUR: ${RATE_USD_PER_EUR:-0.92}
      MODEL_STRONG: ${MODEL_STRONG:-anthropic:claude-opus-4-8}
      MODEL_FAST: ${MODEL_FAST:-anthropic:claude-haiku-4-5-20251001}
      MODEL_EMBEDDING: ${MODEL_EMBEDDING:-google:gemini-embedding-001}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_PATH: /app/storage
      # Recall dials back in to /api/meetings/recall, so the API needs to know the
      # address the outside world reaches it at. Unset means meeting capture refuses
      # to start a bot rather than booking one that can never connect.
      RECALL_API_KEY: ${RECALL_API_KEY:-}
      RECALL_REGION_URL: ${RECALL_REGION_URL:-https://eu-central-1.recall.ai}
      RECALL_WEBHOOK_BASE: ${RECALL_WEBHOOK_BASE:-}
    volumes:
      # Uploaded files live outside the database, so they need durable storage of their
      # own — and the backup job needs to see them.
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Migrations run at boot, so "healthy" genuinely means ready to serve.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/core/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Nightly pg_dump. Writes locally first; uploads to EU object storage when S3_BUCKET
  # is configured. Untested backups are not backups — see deploy/restore.sh.
  backup:
    image: postgres:16
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - storage:/storage:ro
      # A host directory rather than a named volume: deploy/offsite.sh runs on the
      # host and needs to read these, and this image ships no rsync or ssh to do it
      # from inside.
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # A backup job that fails silently is worse than none — it looks healthy right up
    # until a restore. Unhealthy once nothing has been written for 26 hours.
    healthcheck:
      test:
        - CMD-SHELL
        - test -n "$$(find /backups -name '*.sql.gz' -mmin -1560 -print -quit)"
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
