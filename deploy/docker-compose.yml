# Production stack (spec §9). Identical locally and on Hetzner — only deploy/.env differs.
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# A modular monolith deploys as one app, so this stays deliberately small: one reverse
# proxy, one API, one database, one backup job.
name: finsera-platform

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_ZITADEL_ISSUER: ${ZITADEL_ISSUER}
        VITE_ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID}
    environment:
      # Blank locally → Caddy listens on :80 inside the container; a domain in
      # production → Caddy provisions TLS for it.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      MODEL_STRONG: ${MODEL_STRONG:-anthropic:claude-opus-4-8}
      MODEL_FAST: ${MODEL_FAST:-anthropic:claude-haiku-4-5-20251001}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Migrations run at boot, so "healthy" genuinely means ready to serve.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/core/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Nightly pg_dump. Writes locally first; uploads to EU object storage when S3_BUCKET
  # is configured. Untested backups are not backups — see deploy/restore.sh.
  backup:
    image: postgres:16
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
